<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full Page Clip — 테스트 페이지 (긴 페이지)</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f1f1f; background: #fafafa; }
    header.fixed { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #1a73e8; color: #fff; display: flex; align-items: center; padding: 0 20px; font-weight: 700; z-index: 10; }
    .layout { display: flex; gap: 24px; padding: 84px 24px 24px; max-width: 1100px; margin: 0 auto; }
    aside.sticky { position: sticky; top: 84px; align-self: flex-start; width: 200px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    main { flex: 1; }
    section { height: 600px; border: 2px dashed #bbb; border-radius: 12px; margin-bottom: 20px; padding: 16px 20px; background: #fff; position: relative; }
    section h2 { margin: 0 0 8px; font-size: 40px; }
    section .y { position: absolute; right: 16px; top: 16px; font: 14px ui-monospace, Menlo, monospace; color: #666; }
    section img { display: block; width: 320px; height: 180px; border-radius: 8px; margin-top: 12px; }
    .vh { min-height: 50vh; background: linear-gradient(135deg, #fde68a, #fca5a5); }
    footer { padding: 40px 24px; text-align: center; font-size: 28px; font-weight: 800; color: #188038; background: #e6f4ea; }
    .fab { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; background: #d93025; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 10; }
  </style>
</head>
<body>
  <header class="fixed">FIXED HEADER — 전체 캡처에서는 맨 위에 한 번만 보여야 합니다</header>
  <div class="layout">
    <aside class="sticky">STICKY SIDEBAR<br><small>sticky: top 84px</small></aside>
    <main id="main"></main>
  </div>
  <footer>END OF PAGE ✓ (이 줄이 캡처 맨 아래에 보이면 성공)</footer>
  <div class="fab">FAB</div>
  <script>
    // 12 sections (~7,500px), each with a lazy-loaded SVG image so lazy-loading is exercised.
    const main = document.getElementById('main');
    for (let i = 1; i <= 12; i++) {
      const s = document.createElement('section');
      if (i === 5) s.classList.add('vh');
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='320' height='180'><rect width='320' height='180' rx='12' fill='hsl(${i * 30},70%,55%)'/><text x='160' y='105' font-size='56' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='#fff'>IMG ${i}</text></svg>`;
      s.innerHTML = `<h2>Section ${i}</h2><div class="y"></div><p>${i === 5 ? 'min-height: 50vh 섹션' : '일반 섹션'} — 지연 로딩 이미지(loading="lazy")가 아래에 있습니다.</p><img loading="lazy" alt="img ${i}" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
      main.appendChild(s);
    }
    for (const s of document.querySelectorAll('section')) s.querySelector('.y').textContent = 'y = ' + Math.round(s.getBoundingClientRect().top + window.scrollY) + 'px';
  </script>
</body>
</html>
